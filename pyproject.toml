[project]
name = "ai-playground"
version = "0.1.0"
description = "A playground for learning to build AI applications, from the basics to advanced."
readme = "README.md"
requires-python = ">=3.15"

# Packages every experiment uses. Keep this list short: libraries that only
# some experiments need go in a dependency group below instead.
dependencies = [
    "openai>=3.37.0",
    "openinference-instrumentation-openai>=0.1.65",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic-settings>=2.16.1",
]

# Extra packages for particular experiments, installed only when asked for.
# Add one with:      uv add --group <name> <package>
# Install it with:   uv sync --group <name>
# For example, a "rag" group for retrieval experiments, or "notebooks" for Jupyter.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Developer tools. Run them all with `make check` (see the Makefile).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
# Code samples in the docs are laid out by hand for teaching; leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: style errors, F: likely bugs (unused names, undefined names),
# I: import order, UP: newer Python syntax, B: common bug patterns,
# ANN: type hints on every function (see per-file-ignores below).
select = ["E", "W", "F", "I", "UP", "B", "ANN"]
# ANN401 bans the type Any, but it's the honest type for things like JSON.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# ANN requires type hints on every function. Only the shared code in src/
# needs them: tests use mocks and fake data, and experiments are for trying
# things out, so both are left out.
"tests/**" = ["ANN"]
"experiments/**" = ["ANN"]

[tool.ty.src]
# ty checks that the code matches its type hints. Experiments are left out,
# as above.
include = ["src", "tests"]

[tool.ty.terminal]
# Fail on warnings too, not only on errors.
error-on-warning = true

[tool.pytest.ini_options]
# Experiments may keep their own tests next to their code.
testpaths = ["tests", "experiments"]
addopts = "-ra"
